<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banco de preguntas</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E5FA8">
<script>try{var t=JSON.parse(localStorage.getItem("pwa:ajustes")).tema;if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#0B1C33":"#1E5FA8"}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bancos Cx">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="icon" href="iconos/favicon-64.png">
<link rel="stylesheet" href="fuentes/fuentes.css">
<link rel="stylesheet" href="comun/app.css">
</head><body class="motor">
<div class="wrap">
  <!-- 1. Configurar la práctica -->
  <section id="vSetup">
    <div class="top"><a class="back" id="volver" href="index.html#practicar">← Volver</a></div>
    <header class="hero" style="padding-top:0">
      <div class="kicker" id="kicker"></div>
      <h1 id="titulo">Cargando…</h1>
      <p id="subtitulo"></p>
    </header>
    <div id="continuarBox"></div>
    <div class="panel" style="margin-top:14px">
      <div class="field" id="fSecciones" hidden>
        <div class="field-head"><h3 id="tituloSecciones">Temas</h3><button type="button" class="linkbtn mini" id="todosSec">Todos</button></div>
        <div class="checklist" id="secciones"></div>
      </div>
      <div class="field"><h3>Qué preguntas</h3><div class="chips" id="filtro"></div></div>
      <div class="field"><h3>Cuántas</h3><div class="chips" id="cantidad"></div></div>
      <div class="field" style="display:grid;gap:2px">
        <label class="check"><input type="checkbox" id="mezclar" checked> Mezclar el orden</label>
      </div>
      <button class="btn block" id="empezar" type="button">Empezar</button>
    </div>
    <p class="muted" style="font-size:14px;margin-top:14px" id="notaClave"></p>
    <div style="margin-top:6px"><button class="linkbtn danger" id="borrar" type="button">Borrar mi progreso en este banco</button></div>
  </section>

  <!-- 1b. Antes del simulacro -->
  <section id="vSim" hidden></section>

  <!-- 2. Responder -->
  <section id="vQuiz" hidden>
    <div class="qbar">
      <div class="row">
        <button class="back" id="salir" type="button">Pausar</button>
        <span class="count" id="contador"></span>
        <span class="reloj" id="reloj" title="Tiempo"></span>
        <span class="score" id="marcador"></span>
      </div>
      <div class="bar"><i id="barra"></i></div>
    </div>
    <div class="qmain">
      <article class="qcard" id="tarjeta" aria-live="polite"></article>
      <p class="atajos" id="atajos" hidden><kbd>A</kbd>–<kbd>E</kbd> o <kbd>1</kbd>–<kbd>5</kbd> eligen · <kbd>Enter</kbd> o <kbd>→</kbd> siguiente · <kbd>←</kbd> anterior · <kbd>M</kbd> marca ⚑</p>
      <div class="qnav">
        <button class="btn ghost" id="anterior" type="button" aria-label="Anterior">←</button>
        <button class="btn" id="siguiente" type="button">Siguiente</button>
      </div>
    </div>
    <aside class="mapa" id="mapa" hidden aria-label="Mapa de preguntas"></aside>
  </section>

  <!-- 3. Resultados -->
  <section id="vFin" hidden></section>
</div>

<div class="visor" id="visor" hidden>
  <button class="btn amber cerrar" id="cerrarVisor" type="button">Cerrar</button>
  <img id="visorImg" alt="Página original del examen">
</div>

<script src="comun/app.js"></script>
<script>
(async () => {
const { esc, $ } = App;
const L = 'ABCDEF';
const params = new URLSearchParams(location.search);
const lista = k => (params.get(k) || '').split(',').map(s => s.trim()).filter(Boolean);
const ID = params.get('id');
const SIM = params.get('sim');                       // simulacro de la semana N
const SEMANA = params.get('semana');                 // practicar una semana
const SEMANAS = lista('semanas');                    // examen personalizado por semanas
const TEMAS_P = lista('temas').concat(lista('tema')); // uno o varios temas
const REPASO = params.get('repaso');                 // repaso espaciado de hoy
const REPASO_MAX = 30;                               // máximo de preguntas por sesión de repaso
let CAT = { temas: [], bancos: [] };
try { CAT = await (await fetch('datos/catalogo.json')).json(); } catch (e) {}
const nombreTema = Object.fromEntries((CAT.temas || []).map(t => [t.id, t.nombre]));
const temasDeSemana = n => (CAT.temas || []).filter(t => App.semanasDe(t).includes(+n)).map(t => t.id);
const semInfo = n => ((CAT.cronograma || {}).semanas || []).find(s => s.n === +n);

// ¿Qué se practica? -> qué temas, con qué nombre, dónde se guarda la sesión y a dónde vuelve
let MODO = null;   // null = un banco
if (REPASO) MODO = { temas: [], nombre: 'Repaso de hoy', kicker: 'Repaso espaciado', clave: 'repaso', volver: 'index.html#inicio', repaso: true };
else if (SIM) MODO = { temas: temasDeSemana(SIM), nombre: `Simulacro · Semana ${SIM}`, kicker: 'Simulacro semanal', clave: 'simulacro-' + SIM, volver: 'index.html#simulacro', sim: true };
else if (SEMANA) MODO = { temas: temasDeSemana(SEMANA), nombre: `Semana ${SEMANA}` + (semInfo(SEMANA) ? ' · ' + semInfo(SEMANA).titulo : ''), kicker: 'Practicar por semana', clave: 'semana-' + SEMANA, volver: 'index.html#practicar/semana' };
else if (SEMANAS.length) MODO = { temas: [...new Set(SEMANAS.flatMap(temasDeSemana))], nombre: 'Examen personalizado', kicker: 'Semanas ' + SEMANAS.join(', '), clave: 'examen', volver: 'index.html#practicar/examen' };
else if (TEMAS_P.length === 1) MODO = { temas: TEMAS_P, nombre: nombreTema[TEMAS_P[0]] || 'Tema', kicker: 'Practicar un tema', clave: 'tema-' + TEMAS_P[0], volver: 'index.html#practicar/tema' };
else if (TEMAS_P.length > 1) MODO = { temas: TEMAS_P, nombre: 'Examen personalizado', kicker: TEMAS_P.length + ' temas', clave: 'examen', volver: 'index.html#practicar/examen' };
const VARIOS = !!MODO;   // las preguntas vienen de varios bancos

let B, P, guardar, HOY_IDS = [], TODOS = [];
// Modo por lista: junta preguntas de varios bancos (por tema, por semana, repaso...). El progreso de cada
// pregunta se guarda en su propio banco (así cuenta igual si luego abres el banco); la sesión, aparte.
// Cada pregunta de la lista lleva id = 'banco|pregunta'.
async function porLista(preguntas, nombre, claveSes) {
  const almacenes = {};
  const de = b => almacenes[b] || (almacenes[b] = App.cargar(b));
  const partir = k => { const i = k.indexOf('|'); return [k.slice(0, i), k.slice(i + 1)]; };
  const campo = f => new Proxy({}, {
    get: (t, k) => { if (typeof k !== 'string' || !k.includes('|')) return undefined; const [b, id] = partir(k); return de(b)[f][id]; },
    set: (t, k, v) => { const [b, id] = partir(k); de(b)[f][id] = v; return true; },
    deleteProperty: (t, k) => { const [b, id] = partir(k); delete de(b)[f][id]; return true; },
    has: (t, k) => { if (typeof k !== 'string' || !k.includes('|')) return false; const [b, id] = partir(k); return id in de(b)[f]; },
    ownKeys: () => preguntas.map(q => q.id).filter(k => { const [b, id] = partir(k); return id in de(b)[f]; }),
    getOwnPropertyDescriptor: (t, k) => { const [b, id] = partir(k); return id in de(b)[f] ? { value: de(b)[f][id], enumerable: true, configurable: true, writable: true } : undefined; },
  });
  const propio = App.cargar(claveSes);
  const p = { hist: campo('hist'), clave: campo('clave'), flag: campo('flag'), ses: propio.ses };
  const g = () => { Object.entries(almacenes).forEach(([b, d]) => App.guardar(b, d)); App.guardar(claveSes, { hist: {}, ses: p.ses, clave: {}, flag: {} }); };
  return [{ nombre, preguntas }, p, g];
}
const conId = q => Object.assign({}, q, { id: q.gid });   // id global 'banco|pregunta'
// Por temas: todas las preguntas de esos temas, de todos los bancos.
async function porTemas(temas, nombre, claveSes) {
  const quiero = new Set(temas);
  const todos = await App.todas(CAT);
  return porLista(todos.filter(q => quiero.has(q.tema)).map(conId), nombre, claveSes);
}
// Repaso de hoy: las que tocan hoy (máx. 30). Si hay una sesión a medias, también entran sus preguntas
// (ya respondidas ya no "tocan hoy", pero la sesión debe poder continuar).
async function porRepaso(nombre, claveSes) {
  const todos = TODOS = await App.todas(CAT);
  const hoy = App.repaso(todos).hoy.slice(0, REPASO_MAX).map(x => x.gid);
  const ses = App.cargar(claveSes).ses;
  const quiero = new Set(hoy.concat(ses && ses.ids ? ses.ids : []));
  const lista = todos.filter(q => quiero.has(q.gid)).map(conId);
  const [B, p, g] = await porLista(lista, nombre, claveSes);
  return [B, p, g, hoy];
}

try {
  if (MODO && MODO.repaso) [B, P, guardar, HOY_IDS] = await porRepaso(MODO.nombre, MODO.clave);
  else if (MODO) [B, P, guardar] = await porTemas(MODO.temas, MODO.nombre, MODO.clave);
  else {
    B = await (await fetch('datos/' + encodeURIComponent(ID) + '.json')).json();
    P = App.cargar(ID);                 // progreso guardado: hist, ses, clave, flag
    guardar = () => App.guardar(ID, P);
  }
} catch (e) { $('#titulo').textContent = 'No encontré este banco'; return; }
const Q = B.preguntas, byId = Object.fromEntries(Q.map(q => [q.id, q]));
const gid = q => VARIOS ? q.id : ID + '|' + q.id;   // id global para el registro de respuestas
// Agrupación: por tema dentro de un banco o de una semana; por banco dentro de un solo tema.
const UN_TEMA = MODO && MODO.temas.length === 1;
const grupo = q => UN_TEMA ? q.bn : (nombreTema[q.tema] || q.sec);
const clave = q => (q.id in P.clave ? P.clave[q.id] : q.ans);   // la tuya manda sobre la del documento
const tieneClave = q => clave(q) !== null && clave(q) !== undefined;
const orden = Object.fromEntries(Q.map((q, i) => [q.id, i]));
const VERIF = ['confirmada', 'corregida', 'nueva'];
const verificada = q => q.ver && VERIF.includes(q.ver.e) && !(q.id in P.clave);
document.title = B.nombre;
$('#titulo').textContent = B.nombre;
$('#kicker').textContent = MODO ? MODO.kicker : 'Banco';
$('#volver').href = MODO ? MODO.volver : 'index.html#bancos';
const URL_SES = location.pathname.split('/').pop() + '?' + [...params].filter(([k]) => !['continuar', 'auto', 'n', 'f'].includes(k)).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');

// ---------- configuración ----------
const cfg = { secs: null, filtro: params.get('f') || 'todas', cant: params.has('n') ? +params.get('n') : 20 };
const secs = {};
Q.forEach(q => { const g = grupo(q); if (g) secs[g] = (secs[g] || 0) + 1; });
const secsVisibles = Object.entries(secs).filter(([, n]) => n >= (VARIOS ? 1 : 3)).sort((a, b) => a[0].localeCompare(b[0], 'es'));

function pool() {
  return Q.filter(q => {
    if (cfg.secs && !cfg.secs.has(grupo(q))) return false;
    const h = P.hist[q.id];
    if (cfg.filtro === 'nuevas') return !h;
    if (cfg.filtro === 'falladas') return h && h.last === false;
    if (cfg.filtro === 'marcadas') return P.flag[q.id];
    if (cfg.filtro === 'alto') return !!q.rep;
    return true;
  });
}
function renderSetup() {
  const r = App.resumen(P.hist, Q.length);
  $('#subtitulo').textContent = `${Q.length} preguntas` + (r.vistas ? ` · respondidas ${r.vistas} · falladas ${r.mal}` + (r.pct !== null ? ` · ${r.pct}% de aciertos` : '') : '');
  if (secsVisibles.length > 1) {
    $('#fSecciones').hidden = false;
    $('#todosSec').textContent = cfg.secs ? 'Marcar todos' : 'Todos marcados';
    $('#secciones').innerHTML = secsVisibles.map(([s, n]) => `<label class="ck"><input type="checkbox" data-sec="${esc(s)}" ${!cfg.secs || cfg.secs.has(s) ? 'checked' : ''}><span class="nm">${esc(s)}</span><span class="ct">${n}</span></label>`).join('');
  }
  const nF = Q.filter(q => P.hist[q.id] && P.hist[q.id].last === false).length;
  const nN = Q.filter(q => !P.hist[q.id]).length;
  const nM = Q.filter(q => P.flag[q.id]).length;
  const nA = Q.filter(q => q.rep).length;
  const filtros = [['todas', 'Todas', Q.length], ['nuevas', 'Sin responder', nN], ['falladas', 'Las que fallé', nF], ['marcadas', 'Marcadas ⚑', nM]];
  if (nA) filtros.splice(1, 0, ['alto', 'Alto valor ⭐', nA]);
  $('#filtro').innerHTML = filtros.map(([k, t, n]) => `<button type="button" class="chip" data-f="${k}" aria-pressed="${cfg.filtro === k}" ${n || k === 'todas' ? '' : 'disabled'}>${t}<span class="ct">${n}</span></button>`).join('');
  const n = pool().length;
  $('#cantidad').innerHTML = [10, 20, 45, 0].map(c => `<button type="button" class="chip" data-c="${c}" aria-pressed="${cfg.cant === c}">${c || 'Todas · ' + n}</button>`).join('');
  const usar = cfg.cant ? Math.min(cfg.cant, n) : n;
  $('#empezar').textContent = usar ? `Empezar · ${usar} pregunta${usar > 1 ? 's' : ''}` : 'No hay preguntas con estos filtros';
  $('#empezar').disabled = !usar;
  $('#notaClave').textContent = 'Todas las preguntas tienen la respuesta verificada con libros: al responder verás la explicación y la página de la fuente.';
  const s = P.ses;
  $('#continuarBox').innerHTML = s && s.ids && s.ids.every(id => byId[id])
    ? `<button class="resume" id="btnContinuar" type="button">
        <span class="k">Continuar donde me quedé</span>
        <b>Pregunta ${s.i + 1} de ${s.ids.length}</b></button>` : '';
  const bc = $('#btnContinuar'); if (bc) bc.onclick = () => abrir();
}
$('#secciones').onchange = e => {
  const b = e.target.closest('[data-sec]'); if (!b) return;
  const todos = secsVisibles.map(([s]) => s);
  const marcados = new Set([...document.querySelectorAll('#secciones [data-sec]')].filter(x => x.checked).map(x => x.dataset.sec));
  cfg.secs = marcados.size === todos.length ? null : marcados;
  renderSetup();
};
$('#todosSec').onclick = () => { cfg.secs = null; renderSetup(); };
$('#filtro').onclick = e => { const b = e.target.closest('[data-f]'); if (b && !b.disabled) { cfg.filtro = b.dataset.f; renderSetup(); } };
$('#cantidad').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { cfg.cant = +b.dataset.c; renderSetup(); } };
$('#empezar').onclick = () => {
  let ids = pool().map(q => q.id);
  if ($('#mezclar').checked) ids = mezclar(ids);
  if (cfg.cant) ids = ids.slice(0, cfg.cant);
  if (!$('#mezclar').checked) ids.sort((a, b) => orden[a] - orden[b]);
  empezar(ids);
};
$('#borrar').onclick = e => {
  const b = e.currentTarget;
  if (b.dataset.armado) { P = { hist: {}, ses: null, clave: {}, flag: {} }; guardar(); b.textContent = 'Progreso borrado'; delete b.dataset.armado; renderSetup(); }
  else { b.dataset.armado = '1'; b.textContent = 'Toca otra vez para confirmar'; }
};

// ---------- simulacro: 45 preguntas en 25 minutos, corrección al final ----------
const SIM_N = 45, SIM_MS = 25 * 60000;
function renderSim() {
  const n = Math.min(SIM_N, Q.length);
  const ms = Math.max(1, Math.round(SIM_MS * n / SIM_N / 60000)) * 60000;
  const prev = App.simulacros().filter(x => String(x.semana) === String(SIM)).slice(-3).reverse();
  const s = P.ses;
  const enCurso = s && s.sim && s.ids && s.ids.every(id => byId[id]);
  let h = `<div class="top"><a class="back" href="index.html#simulacro">← Volver</a></div>
    <header class="hero" style="padding-top:0"><div class="kicker">Simulacro semanal</div><h1>${esc(B.nombre)}</h1></header>
    <div class="sim-hero">
      <div class="sim-big"><b>${n}</b><span>preguntas</span></div>
      <div class="sim-big"><b>${ms / 60000}</b><span>minutos</span></div>
      <div class="sim-big"><b>${n ? Math.round(ms / n / 1000) : 0}</b><span>seg. por pregunta</span></div>
    </div>
    <ul class="reglas">
      <li>Solo entran los temas de la semana ${esc(SIM)}: ${MODO.temas.filter(t => nombreTema[t]).map(t => esc(nombreTema[t])).join(', ')}.</li>
      <li>El reloj corre aunque salgas de la app. Al llegar a 0 se corrige solo.</li>
      <li>No verás si acertaste hasta el final. Puedes cambiar de respuesta y marcar ⚑ las dudosas.</li>
      ${n < SIM_N ? `<li>Esta semana tiene solo ${Q.length} preguntas verificadas: el simulacro usa todas y el tiempo baja en proporción.</li>` : ''}
    </ul>`;
  if (enCurso) h += `<button class="resume" id="simSeguir" type="button"><span class="k">Simulacro en curso</span><b>Volver al examen · pregunta ${s.i + 1} de ${s.ids.length}</b></button>`;
  else h += `<button class="btn amber block big-btn" id="simEmpezar" type="button" ${n ? '' : 'disabled'}>Empezar simulacro</button>`;
  if (prev.length) h += `<h2 class="section-title">Tus últimos simulacros de esta semana</h2><div class="list">` +
    prev.map(x => `<div class="mini-res"><span>${new Date(x.fecha).toLocaleDateString('es', { day: 'numeric', month: 'short' })}</span><b>${x.nota.toFixed(1)}<small>/20</small></b><span>${x.bien}/${x.n} · ${fmtT(x.ms)}</span></div>`).join('') + '</div>';
  $('#vSim').innerHTML = h;
  const e1 = $('#simEmpezar'); if (e1) e1.onclick = () => {
    const ids = mezclar(Q.map(q => q.id)).slice(0, n);
    P.ses = { ids, i: 0, ans: {}, ts: Date.now(), sim: true, ini: Date.now(), fin: Date.now() + ms, dur: ms, tq: {}, url: URL_SES, nombre: B.nombre };
    guardar(); abrir();
  };
  const e2 = $('#simSeguir'); if (e2) e2.onclick = () => abrir();
}

// ---------- sesión ----------
function mezclar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function empezar(ids) { P.ses = { ids, i: 0, ans: {}, ts: Date.now(), tq: {}, url: URL_SES, nombre: B.nombre }; guardar(); abrir(); }
function abrir() {
  if (P.ses.sim && Date.now() >= P.ses.fin) { corregirSim(); return; }
  mostrar('vQuiz'); cur = { id: null, t0: 0 }; renderQ(); tic();
}
// ---------- pantalla encendida mientras corre el reloj del simulacro ----------
let candado = null;
async function pantallaEncendida(si) {
  try {
    if (!si) { if (candado) { const c = candado; candado = null; await c.release(); } return; }
    if (candado || !('wakeLock' in navigator) || document.hidden) return;
    candado = await navigator.wakeLock.request('screen');
    candado.addEventListener('release', () => { candado = null; });
  } catch (e) { candado = null; }   // sin soporte o sin permiso: se sigue normal
}
function mostrar(v) { ['vSetup', 'vSim', 'vQuiz', 'vFin'].forEach(x => $('#' + x).hidden = x !== v); document.body.classList.toggle('quiz-sim', v === 'vQuiz' && !!(P.ses && P.ses.sim)); window.scrollTo({ top: 0 }); if (v !== 'vQuiz') { clearInterval(reloj); reloj = null; }
  pantallaEncendida(v === 'vQuiz' && !!(P.ses && P.ses.sim)); }

// cronómetro de la pregunta que se ve
let cur = { id: null, t0: 0 }, reloj = null;
function cerrarTiempo() {
  const S = P.ses;
  if (S && cur.id && cur.t0) { S.tq = S.tq || {}; S.tq[cur.id] = (S.tq[cur.id] || 0) + Math.min(Date.now() - cur.t0, 15 * 60000); }
  cur = { id: cur.id, t0: 0 };
}
function verPregunta(id) {
  const S = P.ses;
  const corre = S.sim || S.ans[id] === undefined;   // en práctica, el reloj para al responder
  if (cur.id !== id) { cerrarTiempo(); cur = { id, t0: corre ? Date.now() : 0 }; }
  else if (!cur.t0 && corre) cur.t0 = Date.now();
}
document.addEventListener('visibilitychange', () => {
  if ($('#vQuiz').hidden || !P.ses) return;
  if (!document.hidden && P.ses.sim) pantallaEncendida(true);   // al volver a la app, pedirla de nuevo
  if (document.hidden) { cerrarTiempo(); guardar(); }
  else { const S = P.ses, id = S.ids[S.i]; if (S.sim || S.ans[id] === undefined) cur = { id, t0: Date.now() }; tic(); }
});
const fmtT = ms => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
function tic() {
  clearInterval(reloj);
  const paso = () => {
    const S = P.ses; if (!S) return;
    if (S.sim) {
      const quedan = S.fin - Date.now();
      $('#reloj').textContent = '⏱ ' + fmtT(quedan);
      $('#reloj').className = 'reloj' + (quedan < 5 * 60000 ? ' poco' : '');
      if (quedan <= 0) { clearInterval(reloj); corregirSim(); }
    } else {
      const q = S.ids[S.i];
      const t = (S.tq && S.tq[q] || 0) + (cur.t0 && cur.id === q ? Date.now() - cur.t0 : 0);
      $('#reloj').textContent = S.ans[q] !== undefined ? '' : '⏱ ' + fmtT(t);
      $('#reloj').className = 'reloj suave';
    }
  };
  paso(); reloj = setInterval(paso, 1000);
}

function registrar(q, ok, ms) {
  const h = P.hist[q.id] || { n: 0, ok: 0, last: null };
  const primera = !h.n;
  h.n++; if (ok === true) h.ok++; h.last = ok; P.hist[q.id] = h;
  const yaCumplia = App.metaEstado().cumplida;
  App.anotar(gid(q), ms, ok, primera);
  if (!yaCumplia) { const m = App.metaEstado(); if (m.cumplida) App.aviso(`¡Meta de hoy cumplida! 🔥 ${m.racha} ${m.racha === 1 ? 'día seguido' : 'días seguidos'}`); }
}

let editando = false;   // eligiendo la clave a mano
let mapaAbierto = false;   // el mapa del simulacro va plegado en el celular
let animada = null;    // última pregunta que entró con animación
let fresca = null;     // pregunta recién respondida (para animar el acierto o el fallo una sola vez)
function fuentes(q) {
  const v = q.ver; if (!v) return '';
  let h = '';
  if (v.e === 'corregida') h += '<p class="muted" style="font-size:14px"><b>Clave corregida:</b> la del documento original estaba mal.</p>';
  if (v.n) h += `<p class="muted" style="font-size:14px"><span class="lbl">Nota:</span> ${esc(v.n)}</p>`;
  if (v.f && v.f.length) h += `<p class="fuente"><span class="lbl">Fuente:</span> ${v.f.map(esc).join(' · ')}</p>`;
  return h;
}
function renderQ() {
  const S = P.ses, q = byId[S.ids[S.i]];
  verPregunta(q.id);
  const elegida = S.ans[q.id], respondida = elegida !== undefined, k = clave(q);
  const sim = !!S.sim;
  const anima = fresca === q.id; fresca = null;
  $('#contador').textContent = `${S.i + 1} / ${S.ids.length}`;
  if (sim) $('#marcador').innerHTML = `<span class="muted">${Object.keys(S.ans).length} resp.</span>`;
  else {
    const ok = S.ids.filter(id => S.ans[id] !== undefined && S.ans[id] === clave(byId[id])).length;
    const mal = S.ids.filter(id => S.ans[id] !== undefined && tieneClave(byId[id]) && S.ans[id] !== clave(byId[id])).length;
    $('#marcador').innerHTML = `<span class="v">✓ ${ok}</span> · <span class="x">✗ ${mal}</span>`;
  }
  $('#salir').textContent = sim ? 'Salir' : 'Pausar';
  $('#barra').style.width = `${Object.keys(S.ans).length / S.ids.length * 100}%`;

  let h = '<div class="meta">';
  if (q.rep) h += `<span class="pill amber">⭐ Alto valor</span>`;
  if (!sim) {
    if (UN_TEMA) h += `<span class="pill">${esc(q.bn)}</span>`;
    else if (grupo(q)) h += `<span class="pill">${esc(grupo(q))}</span>`;
  }
  if (P.flag[q.id]) h += '<span class="pill warn">⚑ marcada</span>';
  h += `</div><p class="stem">${esc(q.stem)}</p><ol class="opts">`;
  const corregir = respondida && !sim && !editando && tieneClave(q);
  q.opts.forEach((o, i) => {
    let c = 'opt';
    if (corregir) { if (i === k) c += ' right' + (anima && elegida === k ? ' pulso' : ''); else if (i === elegida) c += ' wrong' + (anima ? ' tiembla' : ''); }
    else if (respondida && i === elegida) c += ' pick';
    h += `<li><button type="button" class="${c}" data-i="${i}" ${corregir ? 'disabled' : ''}><span class="L">${L[i]}</span><span class="T">${esc(o)}</span></button></li>`;
  });
  h += '</ol>';

  if (respondida && !sim) {
    h += '<div class="fb">';
    if (editando) {
      h += '<div class="res nk">Toca la opción correcta</div><p>Se guardará como la clave de esta pregunta en tu celular.</p>';
    } else if (!tieneClave(q)) {
      h += '<div class="res nk">Esta pregunta no trae la respuesta</div>';
      if (q.why) h += `<p><span class="lbl">Por qué:</span> ${esc(q.why)}</p>` + fuentes(q);
      h += '<p class="muted" style="font-size:14px">Si sabes cuál es la correcta, tócala para guardarla como clave.</p>';
    } else {
      h += elegida === k ? '<div class="res ok">Correcto</div>' : `<div class="res ko">Incorrecto · la respuesta es ${L[k]}</div>`;
      if (S.tq && S.tq[q.id]) h += `<p class="muted" style="font-size:13px;margin-top:-4px">Tardaste ${fmtT(S.tq[q.id])}</p>`;
      if (q.why) h += `<p><span class="lbl">Por qué:</span> ${esc(q.why)}</p>`;
      if (verificada(q)) h += fuentes(q);
      else h += `<p class="muted" style="font-size:14px">Clave elegida por ti.</p>`;
    }
    h += '</div>';
    if (q.rep) h += `<p class="muted" style="font-size:14px;margin-top:10px">⭐ <b>Alto valor:</b> esta pregunta (o una muy parecida) aparece ${q.rep.n} veces ${q.rep.en.length > 1 ? 'en ' + q.rep.en.length + ' bancos' : 'en el mismo banco'} (${q.rep.en.map(esc).join(', ')}). Es probable que vuelva a salir.</p>`;
  }
  h += '<div class="tools">';
  if (respondida && !sim && tieneClave(q) && !editando) h += '<button class="linkbtn" type="button" data-accion="editar">¿La clave está mal? Corregirla</button>';
  if (!sim && B.imgs && B.imgs[q.p - 1]) h += '<button class="linkbtn" type="button" data-accion="foto">Ver el original</button>';
  h += `<button class="linkbtn" type="button" data-accion="flag">${P.flag[q.id] ? 'Quitar marca ⚑' : sim ? 'Marcar ⚑ (dudosa)' : 'Marcar ⚑ (repasar)'}</button>`;
  h += '</div>';
  $('#tarjeta').innerHTML = h;
  if (animada !== q.id) { animada = q.id; $('#tarjeta').classList.remove('entra'); void $('#tarjeta').offsetWidth; $('#tarjeta').classList.add('entra'); }
  $('#anterior').disabled = S.i === 0;
  $('#siguiente').textContent = S.i === S.ids.length - 1 ? (sim ? 'Terminar y corregir' : 'Ver resultados') : 'Siguiente';
  delete $('#siguiente').dataset.armado;
  $('#mapa').hidden = !sim;
  $('#mapa').classList.toggle('abierto', mapaAbierto);
  if (sim) $('#mapa').innerHTML = `<button type="button" class="mapa-toggle" id="mapaToggle" aria-expanded="${mapaAbierto}">${mapaAbierto ? 'Ocultar el mapa' : 'Ver las ' + S.ids.length}<span>${Object.keys(S.ans).length} respondidas</span></button><div class="mapa-cuerpo">` +
    S.ids.map((id, i) => `<button type="button" data-ir="${i}" aria-label="Pregunta ${i + 1}" class="${i === S.i ? 'aqui ' : ''}${S.ans[id] !== undefined ? 'hecha ' : ''}${P.flag[id] ? 'dudosa' : ''}">${i + 1}</button>`).join('') +
    `<button type="button" class="terminar" id="terminarYa">Terminar ya</button></div>`;
}

$('#mapa').onclick = e => {
  if (e.target.closest('#mapaToggle')) { mapaAbierto = !mapaAbierto; renderQ(); return; }
  const b = e.target.closest('[data-ir]');
  if (b) { P.ses.i = +b.dataset.ir; mapaAbierto = false; guardar(); renderQ(); window.scrollTo({ top: 0 }); return; }
  if (e.target.id === 'terminarYa') {
    const t = e.target;
    if (t.dataset.armado) corregirSim();
    else { t.dataset.armado = '1'; const faltan = P.ses.ids.length - Object.keys(P.ses.ans).length; t.textContent = faltan ? `Te faltan ${faltan}. Toca otra vez para terminar` : 'Toca otra vez para terminar'; }
  }
};
$('#tarjeta').onclick = e => {
  const S = P.ses, q = byId[S.ids[S.i]];
  const o = e.target.closest('[data-i]');
  if (o && !o.disabled) {
    const i = +o.dataset.i;
    if (S.sim) { S.ans[q.id] = i; }                        // simulacro: se puede cambiar, se corrige al final
    else if (S.ans[q.id] === undefined) {                  // primera respuesta
      cerrarTiempo();
      S.ans[q.id] = i; fresca = q.id;
      registrar(q, tieneClave(q) ? i === clave(q) : null, (S.tq || {})[q.id]);
      if (tieneClave(q)) App.vibrar(i === clave(q) ? 25 : [45, 60, 45]);
    } else if (editando || !tieneClave(q)) {               // fijar la clave a mano
      P.clave[q.id] = i; editando = false;
      const h = P.hist[q.id]; if (h) { if (h.last === true) h.ok--; h.last = S.ans[q.id] === i; if (h.last) h.ok++; }
    }
    S.ts = Date.now(); guardar(); renderQ(); return;
  }
  const a = e.target.closest('[data-accion]'); if (!a) return;
  if (a.dataset.accion === 'editar') { editando = true; renderQ(); }
  if (a.dataset.accion === 'flag') { if (P.flag[q.id]) delete P.flag[q.id]; else P.flag[q.id] = 1; guardar(); renderQ(); }
  if (a.dataset.accion === 'foto') { $('#visorImg').src = B.imgs[q.p - 1]; $('#visor').hidden = false; $('#visor').scrollTop = 0; }
};
$('#cerrarVisor').onclick = () => { $('#visor').hidden = true; };

// ---------- gestos: deslizar a la izquierda = siguiente, a la derecha = anterior ----------
(() => {
  let ini = null;
  const zona = $('#vQuiz');
  zona.addEventListener('touchstart', e => {
    ini = null;
    if (e.touches.length !== 1 || !$('#visor').hidden) return;
    const t = e.touches[0];
    if (t.clientX < 24 || t.clientX > innerWidth - 24) return;                       // borde: gesto de "atrás" del sistema
    if (e.target.closest('#mapa, .qbar, .qnav, input, textarea, details')) return;
    const sel = window.getSelection && getSelection();
    if (sel && String(sel).length > 0) return;                                      // hay texto seleccionado
    ini = { x: t.clientX, y: t.clientY, t: Date.now() };
  }, { passive: true });
  zona.addEventListener('touchend', e => {
    if (!ini || !e.changedTouches.length) return;
    const t = e.changedTouches[0], dx = t.clientX - ini.x, dy = t.clientY - ini.y, dt = Date.now() - ini.t;
    ini = null;
    if (dt > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2.2) return;   // solo si es claramente horizontal
    const S = P.ses; if (!S) return;
    if (dx < 0 && S.i < S.ids.length - 1) $('#siguiente').click();                   // en la última no termina solo
    else if (dx > 0) $('#anterior').click();
  }, { passive: true });
  zona.addEventListener('touchcancel', () => { ini = null; }, { passive: true });
})();

// ---------- teclado (solo en computadora) ----------
const hayTeclado = matchMedia('(hover:hover) and (pointer:fine)').matches;
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || $('#vQuiz').hidden || !P.ses) return;
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (!$('#visor').hidden) { if (e.key === 'Escape') $('#visor').hidden = true; return; }
  const k = e.key;
  const clic = el => { if (el && !el.disabled) { e.preventDefault(); el.click(); } };
  if (k === 'ArrowRight') clic($('#siguiente'));
  else if (k === 'ArrowLeft') clic($('#anterior'));
  else if (k === 'Enter') { if (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY') return; clic($('#siguiente')); }   // sobre un botón, Enter ya lo activa solo
  else if (k.length === 1) {
    const c = k.toUpperCase();
    if (c === 'M') { clic($('#tarjeta [data-accion="flag"]')); return; }
    let i = L.indexOf(c); if (i < 0 && c >= '1' && c <= '9') i = +c - 1;
    if (i >= 0) clic($('#tarjeta').querySelector(`.opt[data-i="${i}"]`));
  }
});
if (hayTeclado) $('#atajos').hidden = false;
$('#siguiente').onclick = () => {
  const S = P.ses; editando = false;
  if (S.i < S.ids.length - 1) { S.i++; S.ts = Date.now(); guardar(); renderQ(); window.scrollTo({ top: 0 }); }
  else if (S.sim) {
    const faltan = S.ids.length - Object.keys(S.ans).length;
    const b = $('#siguiente');
    if (faltan && !b.dataset.armado) { b.dataset.armado = '1'; b.textContent = `Te faltan ${faltan} · toca otra vez`; return; }
    corregirSim();
  }
  else terminar();
};
$('#anterior').onclick = () => { const S = P.ses; editando = false; if (S.i > 0) { S.i--; guardar(); renderQ(); window.scrollTo({ top: 0 }); } };
$('#salir').onclick = () => { editando = false; cerrarTiempo(); guardar(); if (MODO && MODO.repaso) { location.href = MODO.volver; return; } if (P.ses && P.ses.sim) { renderSim(); mostrar('vSim'); } else { renderSetup(); mostrar('vSetup'); } };   // la sesión queda guardada

// ---------- resultados ----------
// Repaso: cuándo vuelve a tocar lo que acertaste y lo que fallaste (según el registro ya actualizado)
function cuandoVuelve(bien, falladas) {
  const pg = App.programas(bien.concat(falladas));
  const cuando = d => d === 1 ? 'mañana' : `en ${d} días`;
  const por = ids => { const m = {}; ids.forEach(id => { const x = pg[id]; if (x) m[x.dias] = (m[x.dias] || 0) + 1; }); return Object.entries(m).sort((a, b) => a[0] - b[0]); };
  const frase = ids => por(ids).map(([d, n]) => `${n} ${n === 1 ? 'vuelve' : 'vuelven'} ${cuando(+d)}`).join(' · ');
  let h = '<div class="cuando">';
  if (bien.length) h += `<div class="ok"><b>Acertaste ${bien.length}</b>${frase(bien)}. Mientras más veces aciertes seguidas, más tarde vuelve.</div>`;
  if (falladas.length) h += `<div class="ko"><b>Fallaste ${falladas.length}</b>${frase(falladas)}.</div>`;
  return h + '</div>';
}
function revision(ids, ans, titulo) {
  if (!ids.length) return '';
  let h = `<h2 class="section-title">${titulo}</h2><div class="rlist">`;
  ids.forEach(id => {
    const q = byId[id], k = clave(q), a = ans[id];
    const est = a === undefined ? 'blanco' : a === k ? 'bien' : 'mal';
    h += `<details class="r-${est}"><summary><span class="dot"></span><span>${esc(q.stem.slice(0, 110))}${q.stem.length > 110 ? '…' : ''}</span></summary><div class="body">
      <p>${esc(q.stem)}</p>` +
      (a === undefined ? '<p class="muted">No la respondiste.</p>' : a !== k ? `<p>Tu respuesta: <b>${L[a]}.</b> ${esc(q.opts[a])}</p>` : '') +
      `<p style="color:var(--ok)">Correcta: <b>${L[k]}.</b> ${esc(q.opts[k])}</p>${q.why ? `<p><span class="lbl">Por qué:</span> ${esc(q.why)}</p>` : ''}${fuentes(q)}</div></details>`;
  });
  return h + '</div>';
}
function fiesta() {
  const cols = ['var(--amber)', 'var(--accent)', 'var(--ok)', 'var(--bad)'];
  const el = document.createElement('div'); el.className = 'fiesta'; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = Array.from({ length: 28 }, (_, i) => `<i style="--x:${(i * 37 + 5) % 100};--d:${((i * 53) % 90) / 100}s;--dx:${((i * 29) % 120) - 60}px;--c:${cols[i % cols.length]}"></i>`).join('');
  document.body.appendChild(el); setTimeout(() => el.remove(), 4500);
}
function terminar() {
  cerrarTiempo();
  const S = P.ses;
  const resp = S.ids.filter(id => S.ans[id] !== undefined);
  const conK = resp.filter(id => tieneClave(byId[id]));
  const bien = conK.filter(id => S.ans[id] === clave(byId[id]));
  const falladas = S.ids.filter(id => tieneClave(byId[id]) && S.ans[id] !== undefined && S.ans[id] !== clave(byId[id]));
  const pct = conK.length ? Math.round(bien.length / conK.length * 100) : 0;
  const tTotal = Object.values(S.tq || {}).reduce((a, b) => a + b, 0);
  P.ses = null; guardar();
  let h = `<div class="top"><a class="back" href="${esc(MODO ? MODO.volver : 'index.html#bancos')}">← Volver</a></div>
    <div class="kicker">${esc(B.nombre)}</div>
    <div class="score-hero ${pct >= 70 ? 'celebra' : ''}"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div>
      <div><p class="big">${bien.length}<span> / ${conK.length}</span></p>
      <p class="muted" style="margin:0">aciertos` +
    (resp.length < S.ids.length ? ` · ${S.ids.length - resp.length} sin responder` : '') +
    (tTotal ? `<br>Tiempo: ${fmtT(tTotal)} · ${fmtT(tTotal / Math.max(1, resp.length))} por pregunta` : '') + '</p></div></div><div class="actions">';
  if (falladas.length) h += `<button class="btn" type="button" id="repasar">Repasar las ${falladas.length} que fallé</button>`;
  if (MODO && MODO.repaso) {
    const quedan = Math.max(0, App.repaso(TODOS).hoy.length);
    if (quedan) h += `<a class="btn amber" href="banco.html?repaso=1">Seguir con el repaso · quedan ${quedan}</a>`;
    h += `<a class="btn ghost" href="${esc(MODO.volver)}">Volver al inicio</a></div>` + cuandoVuelve(bien, falladas);
  } else h += '<button class="btn ghost" type="button" id="otra">Nueva práctica</button></div>';
  h += revision(falladas, S.ans, 'Las que fallaste');
  $('#vFin').innerHTML = h;
  mostrar('vFin');
  if (pct >= 70) fiesta();
  const rp = $('#repasar'); if (rp) rp.onclick = () => empezar(mezclar(falladas));
  const ot = $('#otra'); if (ot) ot.onclick = () => { renderSetup(); mostrar('vSetup'); };
}
function corregirSim() {
  cerrarTiempo();
  const S = P.ses; if (!S) return;
  const tq = S.tq || {};
  S.ids.forEach(id => { const q = byId[id]; if (S.ans[id] !== undefined) registrar(q, S.ans[id] === clave(q), tq[id]); });
  const bien = S.ids.filter(id => S.ans[id] !== undefined && S.ans[id] === clave(byId[id]));
  const mal = S.ids.filter(id => S.ans[id] !== undefined && S.ans[id] !== clave(byId[id]));
  const blanco = S.ids.filter(id => S.ans[id] === undefined);
  const usado = Math.min(Date.now(), S.fin) - S.ini;
  const nota = S.ids.length ? bien.length / S.ids.length * 20 : 0;
  App.guardarSimulacro({ semana: SIM, fecha: Date.now(), n: S.ids.length, bien: bien.length, mal: mal.length, blanco: blanco.length, ms: usado, dur: S.dur, nota: Math.round(nota * 10) / 10 });
  const ids = S.ids, ans = S.ans;
  P.ses = null; guardar();
  const pct = Math.round(bien.length / Math.max(1, ids.length) * 100);
  let h = `<div class="top"><a class="back" href="index.html#simulacro">← Volver</a></div>
    <div class="kicker">${esc(B.nombre)} · corregido</div>
    <div class="score-hero ${pct >= 70 ? 'celebra' : ''}"><div class="ring ${nota >= 10.5 ? 'aprob' : 'desaprob'}" style="--p:${pct}"><b>${nota.toFixed(1)}</b><small>/20</small></div>
      <div><p class="big">${bien.length}<span> / ${ids.length}</span></p>
      <p class="muted" style="margin:0">${mal.length} incorrectas · ${blanco.length} en blanco<br>Tiempo usado: ${fmtT(usado)} de ${fmtT(S.dur)}<br>Promedio: ${fmtT(usado / Math.max(1, ids.length - blanco.length))} por pregunta</p></div></div>
    <p class="muted" style="font-size:14px">${nota >= 10.5 ? 'Aprobado.' : 'Aún no llega a 10.5.'} Las preguntas en blanco cuentan como incorrectas.</p>
    <div class="actions">${mal.length + blanco.length ? `<button class="btn" type="button" id="repasar">Practicar las ${mal.length + blanco.length} que no acerté</button>` : ''}
    <a class="btn ghost" href="index.html#estadisticas">Ver mis estadísticas</a></div>`;
  h += revision(mal, ans, 'Incorrectas') + revision(blanco, ans, 'En blanco') + revision(bien, ans, 'Correctas');
  $('#vFin').innerHTML = h;
  mostrar('vFin');
  if (pct >= 70) fiesta();
  const rp = $('#repasar'); if (rp) rp.onclick = () => empezar(mezclar(mal.concat(blanco)));
}

if (VARIOS) $('#borrar').hidden = true;
if (UN_TEMA) $('#tituloSecciones').textContent = 'Bancos';
if (MODO && MODO.repaso) {
  if (P.ses && P.ses.ids && P.ses.ids.every(id => byId[id])) abrir();            // sesión a medias: seguir
  else if (HOY_IDS.length) empezar(HOY_IDS.filter(id => byId[id]));              // directo, sin filtros
  else {
    $('#vFin').innerHTML = `<div class="top"><a class="back" href="${esc(MODO.volver)}">← Volver</a></div>
      <div class="score-hero" style="margin-top:30px"><div><p class="big" style="font-size:40px">No tienes repasos pendientes hoy 🎉</p>
      <p class="muted">Cuando respondas preguntas, aquí volverán justo antes de que las olvides.</p></div></div>
      <div class="actions"><a class="btn" href="${esc(MODO.volver)}">Volver al inicio</a></div>`;
    mostrar('vFin');
  }
} else if (SIM) {
  if (params.get('continuar') && P.ses && P.ses.sim) abrir();
  else { renderSim(); mostrar('vSim'); }
} else {
  renderSetup();
  if (params.get('continuar') && P.ses) abrir();
  else if (params.get('auto')) $('#empezar').click();
}
})();
</script>
</body></html>
